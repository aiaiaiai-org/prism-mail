AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

# Keyword-only evidence values expose explicit, self-documenting fields.
Metrics/ParameterLists:
  CountKeywordArgs: false

# Test scenarios keep setup and assertions together.
Metrics/AbcSize:
  Exclude: ["test/**/*"]
Metrics/MethodLength:
  Exclude: ["test/**/*"]
